<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>chrome</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mode="top">
    <!-- Paints over the page when the chrome view is expanded (menus, dropdowns). -->
    <div class="scrim" id="scrim" hidden></div>

    <div class="panel" id="panel" hidden>
      <div class="panel-title">Shields</div>
      <div class="panel-row"><span>Trackers and ads blocked</span><b id="panelcount">0</b></div>
      <div class="panel-row"><span>Resolver</span><em id="paneldns">-</em></div>
      <p class="panel-note">
        Site permissions are denied by default and cross-site referrers are trimmed to the origin.
        Edit the list in <code>src/main/blocker.js</code>.
      </p>
    </div>

    <!--
      Three top-level regions placed by CSS grid areas: tabs / win / nav.
      Switching between the horizontal bar and the vertical sidebar is only a
      change of grid-template-areas -- see [data-mode] in style.css.
    -->
    <div class="chrome">
      <div class="tabrow">
        <div class="tabs" id="tabs"></div>
        <button class="icon newtab" id="newtab" title="New tab (Ctrl+T)">
          <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" /></svg>
        </button>
      </div>

      <div class="wincontrols">
        <button class="wc" id="min" title="Minimize"><svg viewBox="0 0 16 16"><path d="M4 8.5h8" /></svg></button>
        <button class="wc" id="max" title="Maximize"><svg viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" /></svg></button>
        <button class="wc danger" id="close" title="Close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg></button>
      </div>

      <div class="navrow">
        <button class="icon" id="back" title="Back (Alt+Left)">
          <svg viewBox="0 0 16 16"><path d="M10 3l-5 5 5 5" /></svg>
        </button>
        <button class="icon" id="forward" title="Forward (Alt+Right)">
          <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg>
        </button>
        <button class="icon" id="reload" title="Reload (Ctrl+R)">
          <svg viewBox="0 0 16 16" class="i-reload"><path d="M13 8a5 5 0 1 1-1.7-3.8M13 2.5V5.5h-3" /></svg>
          <svg viewBox="0 0 16 16" class="i-stop"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>

        <div class="address" id="address">
          <span class="scheme" id="scheme"></span>
          <input id="url" spellcheck="false" autocomplete="off" placeholder="Search, or type a URL" />
          <button class="shield" id="shield" title="Trackers blocked on this page">
            <svg viewBox="0 0 16 16"><path d="M8 1.8l5 1.9v4c0 3-2.1 5.3-5 6.5-2.9-1.2-5-3.5-5-6.5v-4z" /></svg>
            <span id="shieldcount">0</span>
          </button>
        </div>

        <button class="icon" id="layout" title="Toggle sidebar layout (Ctrl+Shift+E)">
          <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" /><path d="M6.5 3.5v9" /></svg>
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
