<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>New tab</title>
    <style>
      /* Standalone on purpose: this renders in a page view, not a chrome view,
         so it carries its own copy of the tokens. Redesign it freely. */
      :root {
        --bg: #0d0d11;
        --fg: #ededf2;
        --dim: #8b8b99;
        --faint: #55555f;
        --ghost: #34343d;
        --line: #1e1e26;
        --card: #14141a;
        --accent: #f0653a;
        --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf9f7;
          --fg: #16161a;
          --dim: #62616b;
          --faint: #97969f;
          --ghost: #c2c1c9;
          --line: #e7e6e2;
          --card: #fff;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        /* An explicit column, or `width: min(660px, 100%)` on the children
           resolves against an auto column and collapses the card grid. */
        grid-template-columns: min(660px, calc(100% - 48px));
        justify-content: center;
        align-content: center;
        justify-items: center;
        gap: 34px;
        padding: 40px 24px 150px; /* room for the dock */
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      header { text-align: center; }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--dim);
      }
      .big {
        margin: 10px 0 0;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .big span { color: var(--accent); }

      .cue {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 20px;
        padding: 9px 15px 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--dim);
        font-size: 13px;
      }
      kbd {
        font: 500 11px/1 var(--mono);
        padding: 4px 7px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--fg) 9%, transparent);
        color: var(--fg);
      }

      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
        gap: 9px;
        width: 100%;
      }
      a {
        display: block;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--card);
        color: var(--fg);
        text-decoration: none;
        font-size: 13.5px;
        transition: border-color 0.14s ease, transform 0.14s ease;
      }
      a:hover { border-color: var(--accent); transform: translateY(-1px); }
      a small { display: block; margin-top: 3px; color: var(--faint); font-size: 11.5px; }

      footer { color: var(--ghost); font-size: 11.5px; font-family: var(--mono); }
    </style>
  </head>
  <body>
    <header>
      <h1>No toolbar. No tab strip.</h1>
      <p class="big">Everything is <span>⌘K</span></p>
      <div class="cue"><kbd>⌘K</kbd> tabs, history, actions <kbd>⌘/</kbd> every key</div>
    </header>

    <nav>
      <a href="https://duckduckgo.com">DuckDuckGo<small>search</small></a>
      <a href="https://news.ycombinator.com">Hacker News<small>news.ycombinator.com</small></a>
      <a href="https://lobste.rs">Lobsters<small>lobste.rs</small></a>
      <a href="https://github.com">GitHub<small>github.com</small></a>
      <a href="https://mullvad.net/help/dns-over-https-and-dns-over-tls">Mullvad DNS<small>the resolver in use</small></a>
      <a href="https://developer.mozilla.org">MDN<small>developer.mozilla.org</small></a>
    </nav>

    <footer>src/chrome/ — edit and it reloads itself</footer>

    <script>
      // Same reason as the dock: CmdOrCtrl accelerators mean the labels are
      // platform-dependent, and this page has no preload to ask.
      if (!navigator.userAgent.includes('Mac')) {
        for (const el of document.querySelectorAll('kbd, .big span')) {
          el.textContent = el.textContent.replace(/⌘/g, 'Ctrl+')
        }
      }
    </script>
  </body>
</html>
